; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; -e nélkül a pio run a dev buildet fordítja (a native tesztkörnyezetet nem).
default_envs = dev

; Közös ESP32 beállítások, a dev és a prod env ebből örököl.
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = rymcu-esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    earlephilhower/ESP8266Audio 
; Fejlesztői build: soros napló bekapcsolva (115200 baud), OLED debug kijelző (src/display/).
[env:dev]
extends = esp32
build_flags =
    -DHANGSZORO_SERIAL_LOG=1

; Éles build: nincs soros napló, a Serial el sem indul (src/Log.h); nincs OLED kijelző.
[env:prod]
extends = esp32
build_flags =
    -DHANGSZORO_SERIAL_LOG=0
    -DCORE_DEBUG_LEVEL=0
