; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; -e nélkül a pio run a dev buildet fordítja (a native tesztkörnyezetet nem).
default_envs = dev

; Közös ESP32 beállítások, a dev és a prod env ebből örököl.
[esp32]
platform = espressif32@7.1.3
board = rymcu-esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.3
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4

; Fejlesztői build: soros napló bekapcsolva (115200 baud).
[env:dev]
extends = esp32
build_flags = -DHANGSZORO_SERIAL_LOG=1

; Éles build: nincs soros napló, a Serial el sem indul (src/Log.h).
[env:prod]
extends = esp32
build_flags =
    -DHANGSZORO_SERIAL_LOG=0
    -DCORE_DEBUG_LEVEL=0

[env:native]
platform = native
test_build_src = yes
extra_scripts = pre:scripts/native_toolchain.py
build_src_filter =
    -<*>
    +<model/*.cpp>
    +<services/Firewall.cpp>
    +<services/PacketParser.cpp>
    +<services/RingBuffer.cpp>
    +<services/SignalMeter.cpp>
    +<display/Format.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags = -std=gnu++14
